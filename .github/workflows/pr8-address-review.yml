name: PR 8 one-shot review correction

on:
  push:
    branches:
      - fix/detail-sorting-temporal-policy
    paths:
      - .github/workflows/pr8-address-review.yml

permissions:
  contents: write

jobs:
  correct-review-findings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/detail-sorting-temporal-policy
          fetch-depth: 0

      - name: Apply exact review corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          window = Path('src/ui/file_manager_window.cpp')
          text = window.read_text()
          old = '''    selection_ = gtk_multi_selection_new(G_LIST_MODEL(sort_model));\n    g_object_unref(sort_model);\n'''
          new = '''    // gtk_multi_selection_new() takes ownership of the sort-model reference.\n    selection_ = gtk_multi_selection_new(G_LIST_MODEL(sort_model));\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one sort-model ownership site')
          window.write_text(text.replace(old, new, 1))

          metadata = Path('src/ui/detail_metadata.cpp')
          text = metadata.read_text()
          old = '''std::string locale_time_text(GDateTime *local)\n{\n    char *formatted = g_date_time_format(local, "%X");\n    std::string result = formatted != nullptr && formatted[0] != '\\0'\n        ? formatted : "—";\n    g_free(formatted);\n    return result;\n}\n'''
          new = '''std::string locale_time_text(GDateTime *local, const bool show_seconds)\n{\n    if (local == nullptr) {\n        return "—";\n    }\n\n    if (show_seconds) {\n        char *formatted = g_date_time_format(local, "%X");\n        std::string result = formatted != nullptr && formatted[0] != '\\0'\n            ? formatted : "—";\n        g_free(formatted);\n        return result;\n    }\n\n    // %X owns the locale's 12/24-hour convention, but many locales bake\n    // seconds into it. Infer only that convention, then construct a minute\n    // precision clock so System Settings' show-seconds policy remains binding.\n    char *locale_clock = g_date_time_format(local, "%X");\n    char *meridiem = g_date_time_format(local, "%p");\n    const bool twelve_hour = locale_clock != nullptr && meridiem != nullptr &&\n        meridiem[0] != '\\0' && std::strstr(locale_clock, meridiem) != nullptr;\n    g_free(locale_clock);\n    g_free(meridiem);\n\n    char *formatted = g_date_time_format(\n        local, twelve_hour ? "%I:%M %p" : "%H:%M");\n    std::string result = formatted != nullptr && formatted[0] != '\\0'\n        ? formatted : "—";\n    g_free(formatted);\n    return result;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one locale_time_text implementation')
          text = text.replace(old, new, 1)

          old = '''    // "standard" deliberately belongs to the platform locale. An explicit\n    // System Settings mode (including standard-12/standard-24) is rendered by\n    // Common so Files cannot silently substitute its own 24-hour convention.\n    if (loaded != INFILTRATR_IO_OK || !found ||\n        std::strcmp(policy.clock_mode, "standard") == 0) {\n        return locale_time_text(local);\n    }\n'''
          new = '''    // "standard" deliberately belongs to the platform locale, but the\n    // Common-owned show-seconds setting still applies to that presentation.\n    // Explicit modes (including standard-12/standard-24) are rendered by\n    // Common so Files cannot silently substitute its own clock convention.\n    if (loaded != INFILTRATR_IO_OK || !found) {\n        return locale_time_text(local, true);\n    }\n    if (std::strcmp(policy.clock_mode, "standard") == 0) {\n        return locale_time_text(local, policy.show_seconds);\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one standard clock policy block')
          text = text.replace(old, new, 1)
          text = text.replace('return locale_time_text(local);',
                              'return locale_time_text(local, policy.show_seconds);')
          metadata.write_text(text)

          test = Path('tests/detail_metadata_test.cpp')
          text = test.read_text()
          marker = '''    g_free(config_home);\n    g_object_unref(file);\n    return 0;\n}\n'''
          addition = '''    // The locale-owned standard clock must still obey System Settings'\n    // seconds toggle. If this locale's %X includes seconds, the rendered\n    // standard timestamp must no longer end in that unmodified %X value.\n    std::strcpy(policy.clock_mode, "standard");\n    policy.show_seconds = false;\n    if (infiltratr_temporal_posix_policy_save(&policy) != 0) {\n        g_free(config_home);\n        g_object_unref(file);\n        return 10;\n    }\n    g_file_info_set_attribute_uint64(file, G_FILE_ATTRIBUTE_TIME_MODIFIED, 46837U);\n    const std::string standard_without_seconds = detail_modified_text(file);\n    GDateTime *standard_local = g_date_time_new_from_unix_local(46837);\n    if (standard_local == nullptr) {\n        g_free(config_home);\n        g_object_unref(file);\n        return 11;\n    }\n    char *locale_clock = g_date_time_format(standard_local, "%X");\n    char *locale_second = g_date_time_format(standard_local, "%S");\n    const bool locale_shows_seconds =\n        locale_clock != nullptr && locale_second != nullptr &&\n        locale_second[0] != '\\0' && std::strstr(locale_clock, locale_second) != nullptr;\n    const std::string locale_clock_text = locale_clock != nullptr ? locale_clock : "";\n    const bool still_uses_unmodified_locale_clock = locale_shows_seconds &&\n        standard_without_seconds.size() >= locale_clock_text.size() &&\n        standard_without_seconds.compare(\n            standard_without_seconds.size() - locale_clock_text.size(),\n            locale_clock_text.size(), locale_clock_text) == 0;\n    g_free(locale_clock);\n    g_free(locale_second);\n    g_date_time_unref(standard_local);\n    if (standard_without_seconds.empty() || standard_without_seconds == "—" ||\n        still_uses_unmodified_locale_clock) {\n        g_free(config_home);\n        g_object_unref(file);\n        return 12;\n    }\n\n    g_free(config_home);\n    g_object_unref(file);\n    return 0;\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one detail metadata test epilogue')
          test.write_text(text.replace(marker, addition, 1))
          PY

          rm .github/workflows/pr8-address-review.yml
          git diff --check

      - name: Commit corrected candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR #8 review findings"
          git push origin HEAD:fix/detail-sorting-temporal-policy
