          s = s.replace(old, new, 1)

          old = '''    // Stop mount callbacks before any UI/model references owned by this object are released.\n    mounted_places_monitor_.reset();\n\n    if (primary_selection_ != nullptr) {\n'''
          new = '''    // Stop external callbacks before any UI/model references owned by this object are released.\n    mounted_places_monitor_.reset();\n    if (temporal_policy_monitor_ != nullptr) {\n        g_signal_handlers_disconnect_by_data(temporal_policy_monitor_, this);\n        g_object_unref(temporal_policy_monitor_);\n        temporal_policy_monitor_ = nullptr;\n    }\n    for (GtkWidget *cell : modified_cells_) {\n        g_object_weak_unref(G_OBJECT(cell), &FileManagerWindow::on_modified_cell_finalized, this);\n    }\n    modified_cells_.clear();\n\n    if (primary_selection_ != nullptr) {\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        g_signal_connect(factory, "setup", G_CALLBACK(on_factory_setup), this);\n        g_signal_connect(factory, "bind", G_CALLBACK(on_factory_bind), this);\n'''
          new = '''        g_signal_connect(factory, "setup", G_CALLBACK(on_factory_setup), this);\n        g_signal_connect(factory, "bind", G_CALLBACK(on_factory_bind), this);\n        g_signal_connect(factory, "unbind", G_CALLBACK(on_factory_unbind), this);\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''{\n    (void)user_data;\n\n    const int encoded = GPOINTER_TO_INT(\n        g_object_get_data(G_OBJECT(factory), "ifm-detail-field"));\n'''
          new = '''{\n    auto *self = static_cast<FileManagerWindow *>(user_data);\n\n    const int encoded = GPOINTER_TO_INT(\n        g_object_get_data(G_OBJECT(factory), "ifm-detail-field"));\n'''
          # This exact prefix occurs first in on_factory_setup only at this point.
          assert s.count(old) >= 1
          setup_pos = s.index('void FileManagerWindow::on_factory_setup')
          pos = s.index(old, setup_pos)
          s = s[:pos] + s[pos:].replace(old, new, 1)

          old = '''    gtk_widget_add_css_class(label, "ifm-detail-secondary");\n    gtk_list_item_set_child(item, label);\n}\n\nvoid FileManagerWindow::on_factory_bind'''
          new = '''    gtk_widget_add_css_class(label, "ifm-detail-secondary");\n    gtk_list_item_set_child(item, label);\n    if (field == DetailField::Modified) {\n        self->modified_cells_.insert(label);\n        g_object_weak_ref(G_OBJECT(label), &FileManagerWindow::on_modified_cell_finalized, self);\n    }\n}\n\nvoid FileManagerWindow::on_factory_bind'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''{\n    (void)user_data;\n\n    auto *info = G_FILE_INFO(gtk_list_item_get_item(item));\n'''
          new = '''{\n    auto *self = static_cast<FileManagerWindow *>(user_data);\n\n    auto *info = G_FILE_INFO(gtk_list_item_get_item(item));\n'''
          bind_pos = s.index('void FileManagerWindow::on_factory_bind')
          pos = s.index(old, bind_pos)
          s = s[:pos] + s[pos:].replace(old, new, 1)

          old = '''    case DetailField::Modified: {\n        const std::string value = detail_modified_text(info);\n        gtk_label_set_text(GTK_LABEL(child), value.c_str());\n        break;\n    }\n    }\n}\n\nvoid FileManagerWindow::on_icon_factory_setup'''
          new = '''    case DetailField::Modified: {\n        g_object_set_data_full(\n            G_OBJECT(child), "ifm-modified-info", g_object_ref(info),\n            reinterpret_cast<GDestroyNotify>(g_object_unref));\n        const std::string value = detail_modified_text(info);\n        gtk_label_set_text(GTK_LABEL(child), value.c_str());\n        break;\n    }\n    }\n}\n\nvoid FileManagerWindow::on_factory_unbind(GtkSignalListItemFactory *factory,\n                                          GtkListItem *item,\n                                          gpointer user_data)\n{\n    (void)user_data;\n    const int encoded = GPOINTER_TO_INT(\n        g_object_get_data(G_OBJECT(factory), "ifm-detail-field"));\n    if (encoded != static_cast<int>(DetailField::Modified)) {\n        return;\n    }\n    if (GtkWidget *child = gtk_list_item_get_child(item); child != nullptr) {\n        g_object_set_data_full(G_OBJECT(child), "ifm-modified-info", nullptr, nullptr);\n    }\n}\n\nvoid FileManagerWindow::on_icon_factory_setup'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '''GFile *FileManagerWindow::file_from_location_text(const char *text) const\n'''
          assert s.count(marker) == 1
          addition = r'''void FileManagerWindow::arm_temporal_policy_monitor()
{
    if (temporal_policy_monitor_ != nullptr) {
        g_signal_handlers_disconnect_by_data(temporal_policy_monitor_, this);
        g_object_unref(temporal_policy_monitor_);
        temporal_policy_monitor_ = nullptr;
    }

    char directory[4096]{};
    if (!infiltratr_temporal_posix_policy_directory(directory, sizeof(directory))) {
        return;
    }

    GFile *policy_directory = g_file_new_for_path(directory);
    const bool directory_exists = g_file_test(directory, G_FILE_TEST_IS_DIR);
    temporal_policy_monitoring_parent_ = !directory_exists;
    GFile *target = directory_exists
        ? G_FILE(g_object_ref(policy_directory))
        : g_file_get_parent(policy_directory);
    g_object_unref(policy_directory);
    if (target == nullptr) {
        return;
    }

    GError *error = nullptr;
    temporal_policy_monitor_ = g_file_monitor_directory(
        target, G_FILE_MONITOR_WATCH_MOVES, nullptr, &error);
    g_object_unref(target);
    if (error != nullptr) {
        g_error_free(error);
    }
    if (temporal_policy_monitor_ != nullptr) {
        g_signal_connect(temporal_policy_monitor_, "changed",
                         G_CALLBACK(on_temporal_policy_changed), this);
    }
}

void FileManagerWindow::refresh_modified_cells()
{
    for (GtkWidget *cell : modified_cells_) {
        auto *info = G_FILE_INFO(
            g_object_get_data(G_OBJECT(cell), "ifm-modified-info"));
        if (info == nullptr) {
            continue;
        }
        const std::string value = detail_modified_text(info);
        gtk_label_set_text(GTK_LABEL(cell), value.c_str());
    }
}

void FileManagerWindow::on_temporal_policy_changed(GFileMonitor *monitor,
                                                   GFile *file,
                                                   GFile *other_file,
                                                   GFileMonitorEvent event_type,
                                                   gpointer user_data)
{
    (void)monitor;
    (void)event_type;
    auto *self = static_cast<FileManagerWindow *>(user_data);
    const auto has_basename = [](GFile *candidate, const char *expected) {
        if (candidate == nullptr) {
            return false;
        }
        char *basename = g_file_get_basename(candidate);
        const bool matches = g_strcmp0(basename, expected) == 0;
        g_free(basename);
        return matches;
    };

    if (self->temporal_policy_monitoring_parent_) {
        if (!has_basename(file, "infiltrator") &&
            !has_basename(other_file, "infiltrator")) {
            return;
        }
        // System Settings creates the policy directory on first save. Move the
        // watch into it so subsequent atomic presentation.conf replacements are
        // observed directly.
        self->arm_temporal_policy_monitor();
        self->refresh_modified_cells();
        return;
    }

    if (has_basename(file, "presentation.conf") ||
        has_basename(other_file, "presentation.conf")) {
        self->refresh_modified_cells();
    }
}

void FileManagerWindow::on_modified_cell_finalized(gpointer user_data,
                                                   GObject *where_object_was)
{
    auto *self = static_cast<FileManagerWindow *>(user_data);
    self->modified_cells_.erase(GTK_WIDGET(where_object_was));
}

'''
          s = s.replace(marker, addition + marker, 1)
          p.write_text(s)

          p = Path('src/ui/detail_metadata.cpp')
