name: PR 8 final review corrections

on:
  push:
    branches:
      - fix/detail-sorting-temporal-policy
    paths:
      - .github/workflows/pr8-final-review-corrections.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/detail-sorting-temporal-policy
          fetch-depth: 0
      - name: Apply corrections
        run: python3 .github/pr8_final_fix.py
      - name: Commit corrected candidate
        run: |
          rm .github/workflows/pr8-final-review-corrections.yml .github/pr8_final_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining PR #8 review findings"
          git push origin HEAD:fix/detail-sorting-temporal-policy
