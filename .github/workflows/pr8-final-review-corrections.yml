name: PR 8 final review corrections

on:
  push:
    branches:
      - fix/detail-sorting-temporal-policy
    paths:
      - .github/workflows/pr8-final-review-corrections.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/detail-sorting-temporal-policy
          fetch-depth: 0

